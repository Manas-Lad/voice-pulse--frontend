<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Voice Pulse</title>
  <script>
    (() => {
      // 1. Grab token from URL query (?deviceToken=...) or localStorage
      const params = new URLSearchParams(window.location.search);
      let queryToken = params.get('deviceToken');

      // Fallback regex in case URLSearchParams missed it
      if (!queryToken) {
        const match = window.location.href.match(/[?&]deviceToken=([^&#]*)/);
        if (match) queryToken = decodeURIComponent(match[1]);
      }

      const storedToken = localStorage.getItem('deviceToken');
      const token = queryToken || storedToken;

      if (token && token !== "null" && token !== "undefined") {
        // Persist immediately before navigating
        localStorage.setItem('deviceToken', token);
        
        // Go directly to dashboard
        window.location.replace('/dashboard/');
      } else {
        // First-time / unauthenticated user -> go to landing page
        window.location.replace('/landing/');
      }
    })();
  </script>
</head>
<body>
</body>
</html>
